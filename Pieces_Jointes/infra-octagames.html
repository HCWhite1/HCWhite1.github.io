<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infrastructure OctaGames — Architecture Technique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --surface: #ffffff;
  --surface-sub: #f8fafc;
  --f-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--f-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: #f1f5f9;
  padding: 24px 16px;
}

.sheet {
  width: 100%;
  max-width: 1220px;
  margin: 0 auto;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius, 14px);
  padding: 20px 22px 18px;
  display: grid;
  gap: 16px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 12px 32px -12px rgba(15, 23, 42, 0.08);
}

/* ─── En-tête éditorial ─── */
.doc-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.doc-title-group {
  display: grid;
  gap: 4px;
  min-width: 0;
  flex: 1 1 340px;
}

.doc-kicker {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: #2563eb;
}

.doc-kicker svg {
  width: 15px;
  height: 15px;
  flex: none;
}

.doc-head h1 {
  margin: 0;
  font-size: clamp(19px, 2.2vw, 24px);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  color: var(--ink);
}

.doc-sub {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-3);
  max-width: 72ch;
}

.meta-grid {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-sub);
  overflow: hidden;
}

.meta-cell {
  padding: 7px 12px;
  display: grid;
  gap: 1px;
  border-right: 1px solid var(--line);
}

.meta-cell:last-child {
  border-right: none;
}

.meta-k {
  font-family: var(--f-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.meta-v {
  font-family: var(--f-mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}

.meta-v.accent-green {
  color: #047857;
}

/* ─── Zone schéma ─── */
.diagram-frame {
  width: 100%;
  overflow: hidden;
}

svg.arch {
  display: block;
  width: 100%;
  height: auto;
}

/* Classes SVG */
.zone-box {
  fill: url(#dotgrid);
  stroke: #e2e8f0;
  stroke-width: 1;
}

.zone-tag {
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  fill: #475569;
  text-transform: uppercase;
}

.col-tag {
  font-family: var(--f-mono);
  font-size: 9.8px;
  font-weight: 500;
  letter-spacing: 0.09em;
  fill: #94a3b8;
  text-transform: uppercase;
  text-anchor: middle;
}

.card {
  fill: #ffffff;
  stroke: #cbd5e1;
  stroke-width: 1.1;
  filter: url(#card-shadow);
}

.card-hero {
  fill: #ffffff;
  stroke: #94a3b8;
  stroke-width: 1.25;
  filter: url(#hero-shadow);
}

.subcard {
  fill: #f8fafc;
  stroke: #e2e8f0;
  stroke-width: 1;
}

.subcard-db {
  fill: #f0fdf4;
  stroke: #bbf7d0;
  stroke-width: 1;
}

.subcard-gh {
  fill: #f8fafc;
  stroke: #e2e8f0;
  stroke-width: 1;
}

.h-title {
  font-family: var(--f-sans);
  font-weight: 700;
  fill: #0f172a;
  letter-spacing: -0.015em;
}

.h-16 { font-size: 15.5px; }
.h-14 { font-size: 13.5px; }
.h-13 { font-size: 12.5px; }

.body-t {
  font-family: var(--f-sans);
  font-size: 11.8px;
  font-weight: 500;
  fill: #475569;
}

.muted-t {
  font-family: var(--f-sans);
  font-size: 11px;
  font-weight: 400;
  fill: #64748b;
}

.mono-t {
  font-family: var(--f-mono);
  font-size: 10.2px;
  font-weight: 500;
  fill: #475569;
}

.mid { text-anchor: middle; }

.tag rect {
  fill: #f1f5f9;
  stroke: #e2e8f0;
  stroke-width: 1;
}

.tag text {
  font-family: var(--f-mono);
  font-size: 9.8px;
  font-weight: 500;
  fill: #334155;
  text-anchor: middle;
}

.tag-blue rect { fill: #eff6ff; stroke: #bfdbfe; }
.tag-blue text { fill: #1d4ed8; }

.tag-orange rect { fill: #fff7ed; stroke: #fed7aa; }
.tag-orange text { fill: #c2410c; }

.tag-green rect { fill: #ecfdf5; stroke: #a7f3d0; }
.tag-green text { fill: #047857; }

.tag-amber rect { fill: #fffbeb; stroke: #fde68a; }
.tag-amber text { fill: #b45309; }

.edge-pill rect {
  fill: #ffffff;
  stroke: #cbd5e1;
  stroke-width: 1;
}

.edge-pill text {
  font-family: var(--f-mono);
  font-size: 9.8px;
  font-weight: 600;
  fill: #334155;
  text-anchor: middle;
}

.flow {
  fill: none;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.flow-live { stroke: #2563eb; }
.flow-db { stroke: #059669; }
.flow-direct { stroke: #ea580c; stroke-dasharray: 2.2 4.5; }
.flow-camo { stroke: #64748b; stroke-dasharray: 2.2 4.5; }
.flow-ops { stroke: #6d28d9; stroke-dasharray: 6 4.5; }
.flow-backup { stroke: #059669; stroke-dasharray: 6 4.5; }

/* ─── Pied de page analytique (3 colonnes) ─── */
.notes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.note {
  background: var(--surface-sub);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  display: grid;
  gap: 4px;
  align-content: start;
}

.note-h {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
}

.note-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}

.note p {
  margin: 0;
  font-size: 11.2px;
  line-height: 1.45;
  color: var(--ink-2);
}

.note code {
  font-family: var(--f-mono);
  font-size: 10.2px;
  color: var(--ink);
  background: #e2e8f0;
  padding: 0.5px 4px;
  border-radius: 4px;
}

@media (max-width: 640px) {
  .sheet { padding: 14px; }
  .notes { grid-template-columns: 1fr; }
}
</style>
</head>
